name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test -- --run

      - name: Check bundle size
        run: |
          SIZE=$(stat -c%s dist/assets/index-*.js 2>/dev/null || echo 0)
          LIMIT=1500000
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Bundle too large: ${SIZE} bytes (limit: ${LIMIT})"
            exit 1
          fi
          echo "Bundle size: ${SIZE} bytes (OK)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "Argo@1507" --include="*.ts" --include="*.tsx" --include="*.js" .; then
            echo "ERROR: Hardcoded secrets found in source code!"
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked by git!"
            exit 1
          fi
          echo ".env is properly gitignored."
