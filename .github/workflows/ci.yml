name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npx vitest run

      - name: Check bundle size
        run: |
          SIZE=$(find dist/assets -maxdepth 1 -name 'index-*.js' -exec stat -c%s {} \; 2>/dev/null | head -1 || echo 0)
          LIMIT=1500000
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Bundle too large: ${SIZE} bytes (limit: ${LIMIT})"
            exit 1
          fi
          echo "Bundle size: ${SIZE} bytes (OK)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for hardcoded secrets
        run: |
          if grep -rInE "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" . \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" \
            --include="*.yml" --include="*.yaml" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git; then
            echo "ERROR: JWT secrets found in tracked files!"
            exit 1
          fi
          if grep -rInE "SUPABASE_SERVICE_ROLE_KEY[=:][[:space:]]*[A-Za-z0-9_-]" . \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.yml" --include="*.yaml" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git; then
            echo "ERROR: Supabase service role key found in source!"
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked by git!"
            exit 1
          fi
          echo ".env is properly gitignored."
