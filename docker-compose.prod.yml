version: "3.8"

services:
  homecarepro-web:
    image: ghcr.io/fluowai/homecarepro:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://homecare.wootech.com.br
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_REGION=${MINIO_REGION}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
    networks:
      - wootech1
      - homecarepro_swarm_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wootech1"
      - "traefik.http.routers.homecarepro_web.rule=Host(`homecare.wootech.com.br`)"
      - "traefik.http.routers.homecarepro_web.entrypoints=websecure"
      - "traefik.http.routers.homecarepro_web.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.homecarepro_web.service=homecarepro_web"
      - "traefik.http.services.homecarepro_web.loadbalancer.server.port=3000"
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wootech1:
    external: true
  homecarepro_swarm_internal:
    driver: overlay
