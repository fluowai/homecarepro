version: '3.8'

services:
  homecarepro-web:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PUBLIC_VAPID_KEY: ${VITE_PUBLIC_VAPID_KEY}
        VITE_APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-homecare.wootech.com.br}
        VITE_ENABLE_DEMO_MODE: false
    image: homecarepro/web:latest
    container_name: homecarepro-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # As variáveis abaixo devem sido preenchidas no Portainer (Environment Variables)
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_BASE_DOMAIN=${APP_BASE_DOMAIN:-homecare.wootech.com.br}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - WHATSMEOW_URL=${WHATSMEOW_URL:-http://whatsmeow:8080}
      - WHATSMEOW_API_KEY=${WHATSMEOW_API_KEY:-local-whatsmeow-secret}
      - WHATSMEOW_WEBHOOK_KEY=${WHATSMEOW_WEBHOOK_KEY:-local-webhook-secret}
    networks:
      - homecarepro-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsmeow:
    build:
      context: ./whatsmeow-service
      dockerfile: Dockerfile
    image: homecarepro/whatsmeow:latest
    container_name: whatsmeow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WHATSMEOW_API_KEY=${WHATSMEOW_API_KEY:-local-whatsmeow-secret}
      - WHATSMEOW_WEBHOOK_URL=http://homecarepro-web:3000/api/whatsapp/webhook
      - WHATSMEOW_WEBHOOK_KEY=${WHATSMEOW_WEBHOOK_KEY:-local-webhook-secret}
    volumes:
      - whatsmeow_data:/data
    networks:
      - homecarepro-network

networks:
  homecarepro-network:
    name: homecarepro-network
    driver: bridge

volumes:
  whatsmeow_data:
