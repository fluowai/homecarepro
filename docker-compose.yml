version: '3.8'

services:
  homecarepro-web:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PUBLIC_VAPID_KEY: ${VITE_PUBLIC_VAPID_KEY}
        VITE_APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-homecare.wootech.com.br}
        VITE_ENABLE_DEMO_MODE: false
    image: homecarepro/web:latest
    container_name: homecarepro-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # As variáveis abaixo devem sido preenchidas no Portainer (Environment Variables)
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_BASE_DOMAIN=${APP_BASE_DOMAIN:-homecare.wootech.com.br}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-homecare-evo-secret-123}
    networks:
      - homecarepro-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution-api:
    image: atendai/evolution-api:v2.2.1
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${APP_URL:-http://localhost:3000}/evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-homecare-evo-secret-123}
      - DATABASE_PROVIDER=sqlite
      - DATABASE_CONNECTION_URI=sqlite://./db.sqlite
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_db:/evolution/db
    networks:
      - homecarepro-network

networks:
  homecarepro-network:
    name: homecarepro-network
    driver: bridge

volumes:
  evolution_instances:
  evolution_db:
