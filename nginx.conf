upstream homecarepro_backend {
    server homecarepro-backend:3000;
}

server {
    listen 80;
    server_name _;

    # Max upload size for audio dictation / file uploads
    client_max_body_size 12m;

    # Serve static frontend assets with caching
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API requests to the backend container
    location /api/ {
        proxy_pass http://homecarepro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
