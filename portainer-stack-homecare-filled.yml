version: "3.8"

services:
  homecarepro-web:
    image: ghcr.io/fluowai/homecarepro:latest
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      APP_URL: "https://homecare.wootech.com.br"
      VITE_SUPABASE_URL: "${SUPABASE_URL}"
      VITE_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_DB_URL: "${SUPABASE_DB_URL}"
      GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
      ASAAS_API_KEY: "YOUR_ASAAS_API_KEY"
      ASAAS_WEBHOOK_TOKEN: "YOUR_ASAAS_WEBHOOK_TOKEN"
      RESEND_API_KEY: "YOUR_RESEND_API_KEY"
      WHATSMEOW_URL: "http://whatsmeow:8080"
      WHATSMEOW_API_KEY: "${WHATSMEOW_API_KEY}"
      WHATSMEOW_WEBHOOK_KEY: "${WHATSMEOW_WEBHOOK_KEY}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_REGION: "${MINIO_REGION}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME}"
    ports:
      - "3000:3000"
    networks:
      - wootech1
      - homecarepro_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wootech1"
      - "traefik.http.routers.hcpro_web.rule=Host(`homecare.wootech.com.br`)"
      - "traefik.http.routers.hcpro_web.entrypoints=websecure"
      - "traefik.http.routers.hcpro_web.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.hcpro_web.service=hcpro_web_svc"
      - "traefik.http.services.hcpro_web_svc.loadbalancer.server.port=3000"
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=wootech1"
        - "traefik.http.routers.hcpro_web.rule=Host(`homecare.wootech.com.br`)"
        - "traefik.http.routers.hcpro_web.entrypoints=websecure"
        - "traefik.http.routers.hcpro_web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.hcpro_web.service=hcpro_web_svc"
        - "traefik.http.services.hcpro_web_svc.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsmeow:
    image: ghcr.io/fluowai/homecarepro-whatsmeow:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      WHATSMEOW_API_KEY: "${WHATSMEOW_API_KEY}"
      WHATSMEOW_WEBHOOK_URL: "http://homecarepro-web:3000/api/whatsapp/webhook"
      WHATSMEOW_WEBHOOK_KEY: "${WHATSMEOW_WEBHOOK_KEY}"
    volumes:
      - whatsmeow_data:/data
    networks:
      - homecarepro_internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 256M

networks:
  wootech1:
    external: true
  homecarepro_internal:
    driver: overlay

volumes:
  whatsmeow_data:
