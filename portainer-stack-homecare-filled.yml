      # APIs
      GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
      ASAAS_API_KEY: "${ASAAS_API_KEY}"
      ASAAS_WEBHOOK_TOKEN: "${ASAAS_WEBHOOK_TOKEN}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_EMAIL: "HomeCare Pro <nao-responda@homecare.wootech.com.br>"

      # MinIO Storage
      MINIO_ENDPOINT: "https://mypanel.wootech.com.br"
      MINIO_REGION: "us-east-1"
      MINIO_ACCESS_KEY: "qieJSDPE3ZQXxBn2jXIs"
      MINIO_SECRET_KEY: "08Amnx6MUzVqQIbISbQcITfqg85DFfiuD1cqAUSe"
      MINIO_BUCKET_NAME: "homecare"

      # Web Push & PWA Notifications
      VITE_PUBLIC_VAPID_KEY: "BL7r4zrBB2d6UGwx1lsggwxMR6X9BHC41niKWeEHrW00vanciXFSyrBk3KiyZ_ZK6XfjvcJuVDAG6f33D9LfB0Q"
      PRIVATE_VAPID_KEY: "7-W0ilFyk5dct0xZ2JELZxR7SMMdcOSDP-9zEfnjy7Q"
      VITE_ENABLE_SUBDOMAIN_REDIRECT: "false"

    networks:
      - woo-network

    healthcheck:
      test:
        - CMD
        - wget
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://127.0.0.1:3000/api/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=woo-network"
        - "traefik.http.routers.woo-homecare.rule=Host(`homecare.wootech.com.br`) || HostRegexp(`{sub:[a-z0-9-]+}.homecare.wootech.com.br`)"
        - "traefik.http.routers.woo-homecare.entrypoints=websecure"
        - "traefik.http.routers.woo-homecare.tls=true"
        - "traefik.http.routers.woo-homecare.tls.certresolver=letsencrypt"
        - "traefik.http.routers.woo-homecare.service=woo-homecare"
        - "traefik.http.services.woo-homecare.loadbalancer.server.port=3000"

networks:
  woo-network:
    external: true
