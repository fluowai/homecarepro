version: "3.8"

services:
  # ─── Backend API (Express) — container isolado ─────────────────
  homecarepro-backend:
    image: ghcr.io/fluowai/homecarepro/backend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-https://homecare.wootech.com.br}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
    networks:
      - homecarepro_internal
      - homecarepro_backend_only
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Frontend SPA (nginx) — container isolado ──────────────────
  homecarepro-frontend:
    image: ghcr.io/fluowai/homecarepro/frontend:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
    environment:
      - BACKEND_HOST=homecarepro-backend:3000
    networks:
      - homecarepro_internal
      - homecarepro_frontend_only
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homecarepro_internal"
      - "traefik.http.routers.homecarepro.rule=Host(`homecare.wootech.com.br`)"
      - "traefik.http.routers.homecarepro.entrypoints=websecure"
      - "traefik.http.routers.homecarepro.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.homecarepro.service=homecarepro_frontend"
      - "traefik.http.services.homecarepro_frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Caddy (TLS On-Demand) ───────────────────────────────────
  homecarepro-caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile.separated:/etc/caddy/Caddyfile:ro
    networks:
      - homecarepro_internal
      - homecarepro_frontend_only
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  homecarepro_internal:
    external: true
  homecarepro_backend_only:
    driver: overlay
  homecarepro_frontend_only:
    driver: overlay
